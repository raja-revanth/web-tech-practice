<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview Merger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.18), transparent 40%),
          radial-gradient(circle at 80% 100%, rgba(16, 185, 129, 0.14), transparent 45%),
          linear-gradient(160deg, #0f172a, #020617);
      }

      .container {
        width: 860px;
        max-width: 100%;
        padding: 36px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.18);
        backdrop-filter: blur(14px);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      h1 {
        text-align: center;
        color: #f8fafc;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 28px;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        padding: 16px 18px;
        margin-bottom: 20px;
        resize: vertical;
        background: #020617;
        color: #e2e8f0;
        border: 1px solid #334155;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.65;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      textarea::placeholder {
        color: #64748b;
      }

      textarea:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      button {
        min-width: 150px;
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: scale(0.97);
      }

      #merge {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
      }

      #copy {
        background: linear-gradient(135deg, #10b981, #059669);
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
      }

      #clear {
        background: linear-gradient(135deg, #64748b, #475569);
        box-shadow: 0 8px 20px rgba(71, 85, 105, 0.35);
      }

      #output {
        background: #0b1220;
        color: #cbd5e1;
      }

      @media (max-width: 700px) {
        .container {
          padding: 22px;
        }

        h1 {
          font-size: 1.75rem;
        }

        .buttons {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Overview Merger</h1>

      <textarea
        id="input"
        placeholder="Paste all your OVERVIEW blocks here..."
      ></textarea>

      <div class="buttons">
        <button id="merge">Merge</button>
        <button id="copy">Copy Result</button>
        <button id="clear">Clear</button>
      </div>

      <textarea
        id="output"
        readonly
        placeholder="Result will appear here..."
      ></textarea>
    </div>
    <script>
      var input = document.getElementById("input");
      var output = document.getElementById("output");

      document.getElementById("merge").onclick = mergeData;
      document.getElementById("copy").onclick = copyData;
      document.getElementById("clear").onclick = clearData;

      function mergeData() {
        var lines = input.value.split("\n");

        var totals = {};
        var order = [];

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();

          if (line === "") {
            continue;
          }

          if (line.indexOf("OVERVIEW") === 0) {
            continue;
          }

          var pos = line.lastIndexOf("-");

          if (pos === -1) {
            continue;
          }

          var key = line.substring(0, pos).trim();
          var value = parseInt(line.substring(pos + 1).trim());

          if (isNaN(value)) {
            continue;
          }

          if (totals[key] === undefined) {
            totals[key] = 0;
            order.push(key);
          }

          totals[key] += value;
        }

        var result = "OVERVIEW :-\n";

        for (var j = 0; j < order.length; j++) {
          result += order[j] + " - " + totals[order[j]] + "\n";
        }

        output.value = result;
      }

      function copyData() {
        output.select();
        document.execCommand("copy");

        alert("Copied!");
      }

      function clearData() {
        input.value = "";
        output.value = "";
      }
    </script>
    <script src="script.js"></script>
  </body>
</html>
