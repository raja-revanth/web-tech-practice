<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            margin-bottom: 20px;
        }
        canvas {
            border: 2px solid white;
            background-color: #000;
            display: block;
        }
        #info {
            margin-top: 20px;
            text-align: center;
        }
        #score {
            font-size: 20px;
            margin-bottom: 10px;
        }
        #instructions {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Pong Game</h1>
    <canvas id="pongCanvas" width="800" height="400"></canvas>
    <div id="info">
        <div id="score">Player 1: 0 | Player 2: 0</div>
        <div id="instructions">Use W/S keys for Player 1, Up/Down arrows for Player 2</div>
    </div>
    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");
        
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;
        
        let player1 = { x: 20, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, score: 0 };
        let player2 = { x: canvas.width - 30, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, score: 0 };
        let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5, vy: 5, size: ballSize };
        
        let keys = {};
        
        window.addEventListener("keydown", (e) => { keys[e.key] = true; });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });
        
        function update() {
            if (keys["w"] || keys["W"]) player1.y = Math.max(0, player1.y - 6);
            if (keys["s"] || keys["S"]) player1.y = Math.min(canvas.height - player1.height, player1.y + 6);
            if (keys["ArrowUp"]) player2.y = Math.max(0, player2.y - 6);
            if (keys["ArrowDown"]) player2.y = Math.min(canvas.height - player2.height, player2.y + 6);
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.vy = -ball.vy;
            }
            
            if (ball.x - ball.size < player1.x + player1.width &&
                ball.y > player1.y && ball.y < player1.y + player1.height) {
                ball.vx = -ball.vx;
                ball.x = player1.x + player1.width + ball.size;
            }
            
            if (ball.x + ball.size > player2.x &&
                ball.y > player2.y && ball.y < player2.y + player2.height) {
                ball.vx = -ball.vx;
                ball.x = player2.x - ball.size;
            }
            
            if (ball.x < 0) {
                player2.score++;
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.vx = 5;
                ball.vy = 5;
            }
            
            if (ball.x > canvas.width) {
                player1.score++;
                ball.x = canvas.width / 2;
                ball.y = canvas.height / 2;
                ball.vx = -5;
                ball.vy = 5;
            }
            
            document.getElementById("score").textContent = `Player 1: ${player1.score} | Player 2: ${player2.score}`;
        }
        
        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#fff";
            ctx.fillRect(player1.x, player1.y, player1.width, player1.height);
            ctx.fillRect(player2.x, player2.y, player2.width, player2.height);
            ctx.fillRect(ball.x - ball.size / 2, ball.y - ball.size / 2, ball.size, ball.size);
            
            ctx.strokeStyle = "#fff";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    </script>
</body>
</html>
