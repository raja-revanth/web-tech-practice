<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.main {
  width: 350px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
}

.main > div {
  margin-bottom: 18px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
  color: #363636;
}

input {
  width: 100%;
  padding: 10px;
  border: 2px solid #dcdcdc;
  border-radius: 6px;
  font-size: 16px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #67a469;
}

#result {
  display: block;
  width: 100%;
  min-height: 42px;
  padding: 10px;
  border: 2px solid #dcdcdc;
  border-radius: 6px;
  background: #f9f9f9;
  font-size: 18px;
  font-weight: bold;
  color: #333;
}

.main div:last-child {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 6px;
  background: #4caf50;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
}

button:hover {
  background: #3e8e41;
}

button:active {
  transform: scale(0.97);
}
    </style>
  </head>
  <body>
    <div class="main">
      <div>
        <label>input A</label>
        <input type="number" id="inputA" />
      </div>
      <div>
        <label>input B</label>
        <input type="number" id="inputB" />
      </div>
      <div>
        <label>result</label>
        <span id="result"></span>
      </div>
      <div>
        <button id="+" onclick="calculate(this.id)">Add</button>
        <button id="-" onclick="calculate(this.id)">sub</button>
        <button id="*" onclick="calculate(this.id)">mul</button>
        <button id="/" onclick="calculate(this.id)">div</button>
        <button id="%" onclick="calculate(this.id)">mod</button>
      </div>
    </div>
    <script>
      var inputAElement = document.getElementById("inputA");
      var inputBElement = document.getElementById("inputB");
      var resultElement = document.getElementById("result");
      function calculate(operator) {
        switch (operator) {
          case "+":
            resultElement.innerText =
              parseInt(inputAElement.value) + parseInt(inputBElement.value);
            break;
          case "-":
            resultElement.innerText =
              parseInt(inputAElement.value) - parseInt(inputBElement.value);
            break;
          case "*":
            resultElement.innerText =
              parseInt(inputAElement.value) * parseInt(inputBElement.value);
            break;
          case "/":
            resultElement.innerText =
              parseInt(inputAElement.value) / parseInt(inputBElement.value);
            break;
          case "%":
            resultElement.innerText =
              parseInt(inputAElement.value) % parseInt(inputBElement.value);
            break;
          default:
            resultElement.innerText = "something went wrong";
        }
      }
    </script>
  </body>
</html>
